<html lang="es">
<head>

<style>

[hidden]{display:none!important}

button{cursor:pointer;border:0;background:none;text-align:left}

.dh{position:sticky;top:0;background:var(--paper);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);z-index:2}

.hd{padding:8px 14px 6px;display:grid;gap:6px}.hd .r{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd .nm{font:800 18px Archivo,sans-serif;overflow-wrap:anywhere;min-width:0}.hd .dt{color:var(--mut);font-size:14px;white-space:nowrap;flex:none}

.pg{margin:2px 14px 8px}.pg .bar{height:6px;border-radius:3px;margin-top:4px}.pt{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}.pt b{font-weight:600}.pg.ok .pt b{color:var(--ok)}.pg.ok .bar i{background:var(--ok)}

.pill.g{background:var(--gbg);color:var(--gtx)}.pill.b{background:var(--bbg);color:var(--btx)}.pill.a{background:var(--abg);color:var(--atx)}
.obs{margin:8px 14px 0;background:var(--obbg);border-left:3px solid var(--obbd);border-radius:6px}
.oh{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;font-size:14px;color:var(--mut)}
.oh b{font-weight:600;flex:none;color:var(--ink)}.oh .op{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut)}.vm{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;flex:none}
.ob{padding:0 10px 10px;white-space:pre-line;font-size:15px}
.hl{list-style:none;margin:0;padding:0;display:grid}.hl li{padding:8px 0;border-top:1px solid var(--line)}.hl li:first-child{border-top:0}
.e1{display:flex;justify-content:space-between;gap:8px;font-size:14px}.e1 time{color:var(--mut);font-size:13px;white-space:nowrap}
.e1 i{font-style:normal;font-weight:600}.em{color:var(--gtx)}.ed{color:var(--btx)}.e2{color:var(--mut);font-size:13px;overflow-wrap:anywhere}
.chev{display:inline-grid;transition:transform .2s}.chev svg{width:16px;height:16px}
[aria-expanded="true"]>.chev,[aria-expanded="true"] .chev{transform:rotate(180deg)}
.fbar{margin:8px 14px 0}
.ftb{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:14px}
.ftb .fs{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ftb svg{width:18px;height:18px;flex:none}#sum{color:var(--mut);font-size:13px;white-space:nowrap}
.flt{margin:6px 14px 0;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;display:grid;gap:10px}
.hb{position:relative;flex:0 0 46px;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);display:grid;place-items:center}
.hb i{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--ink);color:var(--on-ink);font:600 11px/18px "Source Sans 3",sans-serif;text-align:center;font-style:normal}
.htb{display:flex;gap:4px;margin:0 14px 6px;padding:3px;background:var(--line);border-radius:10px}.htb button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;font-weight:600;padding:7px;border-radius:8px}.htb button[aria-selected=true]{background:var(--paper);color:var(--ink,inherit);box-shadow:0 1px 2px rgba(0,0,0,.15)}.pk{padding:10px 14px}.pk small{display:block;color:var(--mut);font-size:12px}.pk b{font-size:14px;word-break:break-all}.pkh{margin:6px 14px 0;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
#hsh{position:fixed;inset:0;z-index:35}.hbd{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.hpn{position:absolute;left:0;right:0;bottom:0;max-height:75vh;display:flex;flex-direction:column;background:var(--paper);border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
.hph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}.hph b{font:800 16px Archivo,sans-serif}.hph .ib{flex:0 0 36px;height:36px}
.hpb{overflow-y:auto;padding:0 14px 12px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#ptr{height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mut);font-size:13px;font-weight:600;transition:height .2s}#ptr.drag{transition:none}
#dptr{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:30;height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--mut);font-size:13px;font-weight:600;background:var(--paper);transition:height .2s;pointer-events:none}#dptr.drag{transition:none}
.sp{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.net{margin:8px 14px 0;padding:6px 10px;border-radius:8px;background:var(--abg);color:var(--atx);font-size:13px;font-weight:600}
@keyframes inR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}@keyframes inL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
#det.fl>:not(.foot){animation:inR .24s ease-out}#det.fr>:not(.foot){animation:inL .24s ease-out}
@media (prefers-reduced-motion:reduce){#det>*,.hpn{animation:none!important}}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:12px}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
</style>

<body>
<section id="login">
  <h1>Verificación de Inventario</h1>
  <p>Ingresa el PIN y tu nombre para ver los paquetes.</p>
  <input id="pin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
  <input id="nm" type="text" placeholder="Tu nombre" autocomplete="off">
  <p id="err"></p>
  <button class="btn" id="go">Entrar</button>
</section>
<main id="app" hidden>
  <header id="hdr">
    <div class="sr">
      <div class="sf"><input id="q" type="text" inputmode="search" autocomplete="off" placeholder="Buscar cliente o paquete"><button class="qc" id="qc" hidden aria-label="Limpiar búsqueda"></button></div>
      <button class="ib" id="th"></button>
      <button class="ib" id="out" aria-label="Salir"></button>
    </div>
    <div id="cities"></div>
  </header>
  <div id="ptr" aria-live="polite"></div>
  <div id="dptr" aria-live="polite" hidden></div>
  <div id="net" class="net" hidden></div>
  <div class="fbar"><button class="ftb" id="ft" aria-expanded="false" aria-controls="fp"><span id="fi"></span><span class="fs" id="fs"></span><span id="sum"></span><span class="chev" id="fch"></span></button></div>
  <div class="flt" id="fp" hidden>
    <div class="fg"><small>Estado</small><div class="seg" id="est"></div></div>
    <div class="fg"><small>Verificación</small><div class="seg s4" id="ver"></div></div>
  </div>
  <div id="list"></div>
  </main>
<section id="det" hidden></section>
<div id="hsh" hidden><div class="hbd" id="hbd"></div><div class="hpn" role="dialog" aria-label="Historial"></div></div>
<div id="lb" hidden><img alt=""></div>
<script>
const API="https://script.google.com/macros/s/AKfycbwheTUxdUu3CW5TRQ4nuNJ6sOQYVD1f3RB9dlRLAZIGuWk1XXQ9gonApMe1XkDNr9g0/exec";
/* Pega aquí el objeto firebaseConfig de tu proyecto. Mientras valga null, las marcas se guardan solo en cada teléfono. */
const FIREBASE_CONFIG={apiKey:"AIzaSyADklHP0Cxx5LF8vyYqHBdBuDXhZmPoWKo",authDomain:"inventario-b6c7d.firebaseapp.com",databaseURL:"https://inventario-b6c7d-default-rtdb.firebaseio.com",projectId:"inventario-b6c7d",storageBucket:"inventario-b6c7d.firebasestorage.app",messagingSenderId:"1079746598808",appId:"1:1079746598808:web:8fc4769de69a3e084a7ded"};
let DATA={},PIN="";
const keep=s=>/[\p{L}\p{N}]/u.test(s);/* omite líneas que solo tienen símbolos: ****, ---, ( ) … */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s?s[0]+s.slice(1).toLowerCase():"";
const hm=t=>new Date(t).toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"});
const money=v=>v==null?"—":"$"+v;
const S={city:"SALINAS",est:"PENDIENTE",v:"T",q:"",user:"",open:null,obO:new Set(),hs:false};
/* Capa de datos: aquí se conectará Firebase en la versión en vivo */
const store=(()=>{let m={},local=true;try{m=JSON.parse(localStorage.getItem("chk")||"{}")}catch(e){}
  const save=()=>{if(local)try{localStorage.setItem("chk",JSON.stringify(m))}catch(e){}};
  return{get:k=>m[k],set(k,v){if(v)m[k]=v;else delete m[k];save()},replace(o){m=o},useRemote(){local=false;m={}},
    purge(ids){let c=0;Object.keys(m).forEach(k=>{if(!ids.has(k.split("|")[0])){delete m[k];c=1}});if(c)save()}}})();
/* Historial: por id de paquete; si el paquete ya no existe, se borra con él */
const H=(()=>{let m={},local=true;try{m=JSON.parse(localStorage.getItem("hist")||"{}")}catch(e){}
  const save=()=>{if(local)try{localStorage.setItem("hist",JSON.stringify(m))}catch(e){}};
  return{get:id=>m[id]||[],set(id,a){m[id]=a},drop(id){delete m[id];save()},useRemote(){local=false;m={}},
    add(id,a,x,n){(m[id]=m[id]||[]).unshift({u:S.user,t:Date.now(),a,x,n});if(m[id].length>200)m[id].length=200;save()},
    purge(ids){Object.keys(m).forEach(id=>{if(!ids.has(id))delete m[id]});save()}}})();
/* Cada item se identifica por su texto (no por su posición): insertar o reordenar no pierde marcas */
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)};
const items=p=>[["c",p.c],["m",p.m]].flatMap(([s,a])=>{const seen={};return a.map(t=>{const b=s+"_"+hash(t),n=seen[b]=(seen[b]||0)+1,ik=b+"_"+(n-1);return{k:p.id+"|"+ik,ik,t,s}})});
const prog=p=>{const it=items(p);return{d:it.filter(x=>store.get(x.k)).length,n:it.length}};
const PLACE=txt=>"data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360"><rect width="100%" height="100%" fill="#8884"/><text x="50%" y="50%" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#888">'+txt+'</text></svg>');
const PHC=new Map(),PHW=new Set(),pk=(c,n)=>c+"|"+n;
const photo=(c,n)=>PHC.get(pk(c,n))||PLACE("Cargando foto…");
const setImgs=(k,src)=>document.querySelectorAll(".ph img").forEach(im=>{if(im.dataset.k===k)im.src=src});
function loadPhotos(p){
  const city=S.city;
  p.ph.forEach(n=>{const k=pk(city,n);if(PHC.has(k)||PHW.has(k))return;PHW.add(k);
    api({action:"photo",pin:PIN,city,name:n}).then(j=>{
      const b=atob(j.b64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
      const url=URL.createObjectURL(new Blob([u],{type:j.mime||"image/jpeg"}));PHC.set(k,url);setImgs(k,url)
    }).catch(()=>setImgs(k,PLACE("Foto no disponible"))).finally(()=>PHW.delete(k));
  });
}
/* Conexión con el Apps Script */
async function api(body){
  let r;try{r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)})}
  catch(e){throw new Error("Sin conexión con el servidor. Revisa tu internet.")}
  let j;try{j=JSON.parse(await r.text())}
  catch(e){throw new Error("El servidor no respondió como se esperaba. Revisa que la implementación del script permita acceso a «Cualquier persona».")}
  if(!j.ok)throw new Error(j.error||"Error del servidor");
  return j;

function cleanup(){
  if(!RT.on||!Object.keys(DATA).length)return;
  const cur=new Set(Object.values(DATA).flat().map(p=>p.id));if(!cur.size)return;
  let miss={};try{miss=JSON.parse(localStorage.getItem("miss")||"{}")}catch(e){}
  const now=Date.now();let ch=false;
  Object.keys(miss).forEach(id=>{if(cur.has(id)||!RT.ids.has(id)){delete miss[id];ch=true}});
  RT.ids.forEach(id=>{if(cur.has(id))return;
    if(!miss[id]){miss[id]=now;ch=true}

$("#go").addEventListener("click",()=>{
  const pin=$("#pin").value.trim(),nm=$("#nm").value.trim();
  if(!nm){$("#err").textContent="Escribe tu nombre para registrar tus marcas.";return}
  if(!pin){$("#err").textContent="Escribe el PIN.";return}
  enter(pin,nm);
});
try{const n=localStorage.getItem("who")||"",p=localStorage.getItem("pin")||"";$("#nm").value=n;if(n&&p)enter(p,n,true)}catch(e){}
</script>
</body>
</html>
